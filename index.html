<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پیام‌رسان</title>
<meta name="theme-color" content="#0b0f14">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f14; --surface:#141a22; --surface2:#1c2530; --line:#263140; --text:#e8edf3; --muted:#8794a6; --acc:#3ddc97; --amber:#ffb020; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }
  input, select { width: 100%; padding: 12px 14px; font: 400 16px 'Vazirmatn', sans-serif; color: var(--text); background: #0d1218; border: 1px solid var(--line); border-radius: 12px; }
  input:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  button { font: 600 14px 'Vazirmatn', sans-serif; border: 0; border-radius: 10px; padding: 9px 14px; background: var(--surface2); color: var(--text); cursor: pointer; }
  .primary { background: var(--acc); color: #06241a; font-weight: 800; }
  #auth { height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(900px 520px at 50% -10%, #17382f 0%, transparent 60%), var(--bg); }
  .card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 28px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .tabs { display: flex; gap: 6px; margin: 14px 0; }
  .tabs button { flex: 1; } .tabs button.on { background: var(--acc); color: #06241a; }
  .card label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
  .card .primary { width: 100%; margin-top: 18px; padding: 14px; font-size: 17px; border-radius: 14px; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin: 10px 0 0; }

  #app { height: 100%; display: flex; }
  #side { width: 340px; border-inline-end: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 8px; padding: 14px; }
  .top b { flex: 1; font-size: 16px; }
  #search { margin: 0 14px 10px; width: auto; }
  #results { margin: 0 14px; }
  .res { padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; background: var(--surface2); margin-bottom: 6px; }
  #chatList { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .chat { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; cursor: pointer; }
  .chat:hover, .chat.on { background: var(--surface2); }
  .ava { width: 44px; height: 44px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 18px 'Vazirmatn'; background: linear-gradient(135deg, #3ddc97, #1fa6c9); color: #04241c; }
  .ci { flex: 1; min-width: 0; } .ci b { display: block; font-size: 15px; }
  .ci span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { background: var(--acc); color: #06241a; border-radius: 999px; font-size: 12px; font-weight: 800; padding: 1px 8px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 12px; font-size: 14px; }

  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #ph { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  #ph .t { flex: 1; min-width: 0; } #ph b { display: block; } #ph small { color: var(--muted); font-size: 12px; }
  #back { display: none; }
  a.act { text-decoration: none; background: var(--surface2); color: var(--text); border-radius: 10px; padding: 9px 12px; font: 600 13px 'Vazirmatn', sans-serif; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: min(70%, 520px); padding: 8px 12px; border-radius: 16px; background: var(--surface2); align-self: flex-start; word-break: break-word; }
  .m.me { align-self: flex-end; background: #14473a; }
  .m .n { display: block; font-size: 12px; font-weight: 600; color: var(--acc); }
  .m .tm { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  #composer { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
  #composer input { flex: 1; } #composer .primary { padding: 0 20px; }
  #ro { padding: 14px; text-align: center; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); background: var(--surface); }
  #placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--text); padding: 22px; width: min(92vw, 360px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; font-size: 14px; margin: 12px 0 6px; } dialog .row { display: flex; gap: 8px; margin-top: 18px; } dialog .row button { flex: 1; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--line); padding: 10px 18px; border-radius: 12px; font-size: 14px; z-index: 20; }
  @media (max-width: 720px) {
    #side { width: 100%; } #pane { display: none; }
    #app.pane #side { display: none; } #app.pane #pane { display: flex; } #back { display: inline-block; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<section id="auth" hidden>
  <div class="card">
    <h1>پیام‌رسان</h1>
    <p class="sub">چت، گروه و کانال؛ با بیسیم و تماس تصویری</p>
    <div class="tabs"><button id="tLogin" class="on">ورود</button><button id="tReg">ثبت‌نام</button></div>
    <label for="un">نام کاربری</label><input id="un" maxlength="20" autocomplete="username">
    <label for="pw">رمز عبور</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="authErr" role="alert"></p>
    <button class="primary" id="authBtn">ورود</button>
  </div>
</section>

<section id="app" hidden>
  <aside id="side">
    <div class="top"><b id="meName"></b><button id="newBtn" class="primary">+ جدید</button><button id="logout">خروج</button></div>
    <input id="search" placeholder="جستجوی کاربر یا کانال و گروه عمومی">
    <div id="results"></div>
    <div id="chatList"></div>
  </aside>
  <main id="pane">
    <div id="placeholder">یک گفتگو را انتخاب کنید</div>
    <div id="ph" hidden>
      <button id="back">←</button>
      <div class="t"><b id="pt"></b><small id="ps"></small></div>
      <button id="addBtn" hidden>افزودن عضو</button>
      <a class="act" id="aw" target="_blank" rel="noopener">بیسیم</a>
      <a class="act" id="am" target="_blank" rel="noopener">تماس تصویری</a>
    </div>
    <div id="msgs" hidden></div>
    <div id="composer" hidden><input id="txt" maxlength="2000" placeholder="پیام بنویسید…"><button id="sendBtn" class="primary">ارسال</button></div>
    <div id="ro" hidden>فقط مدیر کانال می‌تواند پیام بگذارد</div>
  </main>
</section>

<dialog id="dlg">
  <b>ساخت گروه یا کانال</b>
  <label for="dKind">نوع</label>
  <select id="dKind"><option value="group">گروه</option><option value="channel">کانال</option></select>
  <label for="dName">نام</label><input id="dName" maxlength="40">
  <label><input type="checkbox" id="dPub" style="width:auto"> عمومی (دیگران با جستجو پیدا و عضو شوند)</label>
  <div class="row"><button id="dOk" class="primary">ساخت</button><button id="dCancel">انصراف</button></div>
</dialog>

<script>
// بعد از ساخت سرویس روی Render، آدرس آن را اینجا بگذارید (با wss://)
const PROD_WS_URL = 'wss://REPLACE-ME.onrender.com';
const WS_URL = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'ws://localhost:3000' : PROD_WS_URL;
const SITE = 'https://hoseinxrad-glitch.github.io/wakitaki.github.io/'; // سایت بیسیم و تماس تصویری

const $ = (id) => document.getElementById(id);
let ws, me = '', chats = [], cur = null, unread = {}, retry = null, mode = 'login', last = 0;
const ls = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: (k) => { try { localStorage.removeItem(k); } catch (e) {} },
};
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const title = (c) => (c.kind === 'dm' ? c.other : c.name) || '؟';
const fmt = (t) => new Date(t).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
function toast(text) { const d = document.createElement('div'); d.id = 'toast'; d.textContent = text; document.body.append(d); setTimeout(() => d.remove(), 2800); }

function connect() {
  clearTimeout(retry);
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { const t = ls.get('ms-token'); if (t) send({ type: 'resume', token: t }); else showAuth(); };
  ws.onclose = () => { retry = setTimeout(connect, 2000); };
  ws.onmessage = (e) => on(JSON.parse(e.data));
}
function showAuth() { $('app').hidden = true; $('auth').hidden = false; }

function on(m) {
  if (m.type === 'auth') {
    me = m.username; ls.set('ms-token', m.token);
    $('auth').hidden = true; $('app').hidden = false; $('meName').textContent = me; $('pw').value = '';
  } else if (m.type === 'auth-failed') { ls.del('ms-token'); showAuth(); }
  else if (m.type === 'error') { if (!$('auth').hidden) $('authErr').textContent = m.text; else toast(m.text); }
  else if (m.type === 'info') toast(m.text);
  else if (m.type === 'chats') { chats = m.chats; if (cur) cur = chats.find((c) => c.id === cur.id) || cur; renderList(); }
  else if (m.type === 'history') { if (cur && cur.id === m.chatId) { $('msgs').textContent = ''; m.msgs.forEach(addMsg); } }
  else if (m.type === 'msg') {
    const c = chats.find((x) => x.id === m.chatId);
    if (c) { c.last = m.text; chats = [c, ...chats.filter((x) => x !== c)]; }
    if (cur && cur.id === m.chatId) addMsg(m);
    else if (m.user !== me) unread[m.chatId] = (unread[m.chatId] || 0) + 1;
    renderList();
  } else if (m.type === 'found') renderResults(m);
  else if (m.type === 'opened') openChat(m.chatId);
  else if (m.type === 'members') {
    if (cur && cur.id === m.chatId) $('ps').textContent = (cur.kind === 'channel' ? 'کانال' : 'گروه') + ' • ' + m.members.length + ' عضو';
  }
}

function renderList() {
  const box = $('chatList'); box.textContent = '';
  if (!chats.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'هنوز گفتگویی ندارید. کاربر را جستجو کنید یا گروه بسازید.'; box.append(e); return; }
  chats.forEach((c) => {
    const d = document.createElement('div'); d.className = 'chat' + (cur && cur.id === c.id ? ' on' : '');
    const a = document.createElement('div'); a.className = 'ava'; a.textContent = title(c).charAt(0);
    const i = document.createElement('div'); i.className = 'ci';
    const b = document.createElement('b'); b.textContent = (c.kind === 'channel' ? '📢 ' : c.kind === 'group' ? '👥 ' : '') + title(c);
    const s = document.createElement('span'); s.textContent = c.last || 'بدون پیام';
    i.append(b, s); d.append(a, i);
    if (unread[c.id]) { const g = document.createElement('span'); g.className = 'badge'; g.textContent = unread[c.id]; d.append(g); }
    d.onclick = () => openChat(c.id);
    box.append(d);
  });
}

function roomName(c) { return (c.kind === 'dm' ? 'dm-' + [me, c.other].sort().join('-') : c.name + '-' + c.id).slice(0, 40); }
function openChat(id) {
  const c = chats.find((x) => x.id === id); if (!c) return;
  cur = c; unread[id] = 0; renderList();
  $('app').classList.add('pane');
  $('placeholder').hidden = true; $('ph').hidden = false; $('msgs').hidden = false;
  const canSend = c.kind !== 'channel' || ['owner', 'admin'].includes(c.role);
  $('composer').hidden = !canSend; $('ro').hidden = canSend;
  $('pt').textContent = title(c); $('ps').textContent = c.kind === 'dm' ? 'گفتگوی خصوصی' : '';
  $('addBtn').hidden = !(c.kind !== 'dm' && ['owner', 'admin'].includes(c.role));
  const qs = '?room=' + encodeURIComponent(roomName(c)) + '&name=' + encodeURIComponent(me);
  $('aw').href = SITE + qs; $('am').href = SITE + 'meet.html' + qs;
  $('msgs').textContent = '';
  send({ type: 'open', chatId: id });
  if (c.kind !== 'dm') send({ type: 'members', chatId: id });
  if (canSend) $('txt').focus();
}

function addMsg(m) {
  const d = document.createElement('div'); d.className = 'm' + (m.user === me ? ' me' : '');
  if (m.user !== me && cur && cur.kind !== 'dm') { const n = document.createElement('span'); n.className = 'n'; n.textContent = m.user; d.append(n); }
  d.append(document.createTextNode(m.text));
  const t = document.createElement('span'); t.className = 'tm'; t.textContent = fmt(m.t); d.append(t);
  const box = $('msgs'); box.append(d); box.scrollTop = box.scrollHeight;
}

function renderResults(m) {
  const box = $('results'); box.textContent = '';
  m.users.forEach((u) => { const d = document.createElement('div'); d.className = 'res'; d.textContent = '👤 ' + u.username + ' (پیام خصوصی)'; d.onclick = () => { send({ type: 'dm', username: u.username }); clearSearch(); }; box.append(d); });
  m.chats.forEach((c) => { const d = document.createElement('div'); d.className = 'res'; d.textContent = (c.kind === 'channel' ? '📢 ' : '👥 ') + c.name + ' (عضویت)'; d.onclick = () => { send({ type: 'join', chatId: c.id }); clearSearch(); }; box.append(d); });
}
function clearSearch() { $('search').value = ''; $('results').textContent = ''; }

function sendMsg() {
  const t = $('txt').value.trim();
  if (!t || !cur) return;
  const now = Date.now(); if (now - last < 300) return; last = now;
  send({ type: 'send', chatId: cur.id, text: t }); $('txt').value = '';
}

// رویدادها
function setMode(m) { mode = m; $('tLogin').classList.toggle('on', m === 'login'); $('tReg').classList.toggle('on', m === 'register'); $('authBtn').textContent = m === 'login' ? 'ورود' : 'ساخت حساب'; $('authErr').textContent = ''; }
$('tLogin').onclick = () => setMode('login'); $('tReg').onclick = () => setMode('register');
const doAuth = () => send({ type: mode, username: $('un').value, password: $('pw').value });
$('authBtn').onclick = doAuth;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });
$('logout').onclick = () => { send({ type: 'logout' }); ls.del('ms-token'); me = ''; chats = []; cur = null; $('pane').classList.remove('pane'); $('app').classList.remove('pane'); showAuth(); };
$('newBtn').onclick = () => $('dlg').showModal();
$('dCancel').onclick = () => $('dlg').close();
$('dOk').onclick = () => { send({ type: 'create', kind: $('dKind').value, name: $('dName').value, isPublic: $('dPub').checked }); $('dName').value = ''; $('dlg').close(); };
$('addBtn').onclick = () => { const u = prompt('نام کاربری عضو جدید:'); if (u && cur) send({ type: 'add', chatId: cur.id, username: u.trim() }); };
$('back').onclick = () => { $('app').classList.remove('pane'); cur = null; $('ph').hidden = true; $('msgs').hidden = true; $('composer').hidden = true; $('ro').hidden = true; $('placeholder').hidden = false; renderList(); };
$('sendBtn').onclick = sendMsg;
$('txt').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
let st; $('search').addEventListener('input', (e) => { clearTimeout(st); const v = e.target.value; if (v.trim().length < 2) { $('results').textContent = ''; return; } st = setTimeout(() => send({ type: 'find', q: v }), 300); });

connect();
</script>
</body>
</html>
